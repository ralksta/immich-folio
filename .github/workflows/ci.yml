name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # dev is included because dependency and feature PRs target it — without
    # it those PRs would carry no checks at all, and main would only find out
    # at release time.
    branches: [main, dev]

# Cancel in-progress runs for the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type-check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript – type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Minimal env vars so Next.js build doesn't bail early on env validation
          IMMICH_API_URL: http://localhost:2283
          IMMICH_API_KEY: placeholder-key-for-ci
          AUTH_SECRET: placeholder-secret-for-ci-builds-must-be-32-chars-long
